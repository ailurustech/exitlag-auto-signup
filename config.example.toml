# ==== ExitLag auto-signup (addy.io edition) ====
# Copy this file to config.toml and fill in your values.
# config.toml is gitignored so your secrets never get committed.

store_path = "accounts.db"
log_path = "exitlag_auto.log"

[addy]
# addy.io API key (addy.io -> Settings -> API).
# Can also be supplied via the EXITLAG_ADDY_KEY environment variable.
api_key = "YOUR_ADDY_API_KEY"
# A shared addy.io domain (e.g. "anonaddy.me") or your own custom domain.
# A custom domain is far more reliable: shared aliasing domains are well known
# and may be rejected by ExitLag the same way temp-mail domains are.
domain = "anonaddy.me"
# random_characters | uuid | random_words | custom
alias_format = "random_characters"
# Only used when alias_format = "custom".
local_part = ""
# Delete the alias again if the signup fails, so failures don't burn aliases.
delete_alias_on_failure = true

[signup]
# Leave empty to generate a strong random password per account (recommended:
# reusing one password across every account is an easy pattern to spot).
password = ""
# Random realistic first/last name per account.
randomize_identity = true
first_name = ""
last_name = ""
# Default number of accounts for the "signup" command.
count = 1
# Set true only if ExitLag refuses to work until the address is verified.
# Requires the [imap] section below.
verify_email = false
# Retries per account, with linear backoff and a fresh browser each time.
attempts = 3
backoff_seconds = 5.0

[browser]
# Empty = use the default installed Chrome/Chromium.
path = ""
# Optional proxy, e.g. "http://127.0.0.1:1080". Empty = direct connection.
proxy = ""
# Headless makes the Cloudflare Turnstile challenge much harder to pass.
headless = false
page_timeout = 60
overlay_timeout = 20

[trial]
# Length of the ExitLag free trial.
days = 3
# Treat an account as unusable this many hours before it actually expires, so it
# never dies in the middle of a gaming session.
renew_before_hours = 2

[integration]
# Where the patched portable build reads its credentials from
# (email on line 1, password on line 2).
account_txt_path = "D:\\pc\\accs\\downloads\\exitlag\\account.txt"
# Optional: launched by the "ensure" command. Empty = don't launch anything.
launch_exe = "D:\\pc\\accs\\downloads\\exitlag\\EXPortable_Option2.exe"

# --- Hardware fingerprint rotation ---
# ExitLag ties the free trial to the machine, so a new email alone may not be
# enough to get a fresh trial. Enabling this clears ExitLag's local trial state
# and writes a new random HWID whenever a brand new account is provisioned.
rotate_hwid = false
hwid_txt_path = "D:\\pc\\accs\\downloads\\exitlag\\hwid.txt"
# SAFETY: every entry below must contain "exitlag" or it is refused outright.
clean_paths = [
    "%APPDATA%\\ExitLag",
    "%LOCALAPPDATA%\\ExitLag",
]
registry_keys = [
    "HKCU\\Software\\ExitLag",
]

[imap]
# Only used when signup.verify_email = true. addy.io is forward-only, so the
# confirmation mail arrives in the real mailbox your aliases forward to.
host = "imap.gmail.com"
port = 993
user = ""
# Gmail requires an app password here, not your normal account password.
password = ""
timeout = 180
